name: Build and Release Custom Photon OS 5 OVA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write # Required to push to ghcr.io

env:
  PHOTON_VERSION: "5.0"
  PHOTON_BUILD: "dde71ec57"
  PHOTON_SHA512: "6bd6a307745adb00b8452013f2c308c9abefd24a9d82611e8a1551afb965873388ebde81a34296dc0ad2fa7f0f7b4cd3924701abde0c963ea40b363c444bb037"

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install and Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files || echo "Pre-commit warnings found."


  build-ova:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set Release Tag
        run: |
          # Calculate the release tag early so we can use it in the filenames
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v${{ env.PHOTON_VERSION }}-build-${{ env.PHOTON_BUILD }}-run${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Install Virtualization Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils zip libguestfs-tools qemu-system-x86 unzip wget isc-dhcp-client xmlstarlet

          # Force libguestfs to use the reliable 'slirp' networking backend
          sudo apt-get purge -y passt

          # Fix Ubuntu kernel permissions
          sudo chmod 644 /boot/vmlinuz-*

          # Grant the GHA runner direct access to KVM hardware acceleration
          sudo chmod 0666 /dev/kvm

      - name: Cache VMware ovftool
        id: cache-ovftool
        uses: actions/cache@v6.1.0
        with:
          path: ovftool_dir
          key: ovftool-linux-${{ runner.os }}-v1

      - name: Download and Extract ovftool
        if: steps.cache-ovftool.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.OVF_REPO_TOKEN }}
        run: |
          gh release download v5.1.0 \
            --repo scriptautomate-bc/ovftool-artifacts-mirror \
            --pattern "*.zip" \
            --dir .

          unzip -q *.zip -d ovftool_dir/
          rm *.zip

      - name: Add ovftool to PATH
        run: |
          echo "${{ github.workspace }}/ovftool_dir/ovftool" >> $GITHUB_PATH
          chmod +x ${{ github.workspace }}/ovftool_dir/ovftool/ovftool

      - name: Cache Base Photon OVA
        id: cache-photon-ova
        uses: actions/cache@v6.1.0
        with:
          path: base-photon.ova
          # The cache key is bound to the version, build, and hash.
          # If any env var changes, GHA will automatically start a fresh download.
          key: photon-ova-${{ env.PHOTON_VERSION }}-${{ env.PHOTON_BUILD }}-${{ env.PHOTON_SHA512 }}

      - name: Download Base Photon OS OVA
        if: steps.cache-photon-ova.outputs.cache-hit != 'true'
        run: |
          PHOTON_OVA_URL="https://packages.vmware.com/photon/${PHOTON_VERSION}/GA/ova/photon-hw15-${PHOTON_VERSION}-${PHOTON_BUILD}.x86_64.ova"
          wget -q "$PHOTON_OVA_URL" -O base-photon.ova

      - name: Validate OVA Checksum
        run: |
          # Verify the integrity of the OVA (runs on both downloaded and cached files)
          # Note: The two spaces between the hash and the filename are required by sha512sum
          echo "${PHOTON_SHA512}  base-photon.ova" | sha512sum -c -

      - name: Extract OVA & Customize Disk
        env:
          LIBGUESTFS_DEBUG: 1
          LIBGUESTFS_TRACE: 1
        run: |
          mkdir build-dir
          tar -xvf base-photon.ova -C build-dir
          cd build-dir

          VMDK_FILE=$(ls *.vmdk)

          # Convert to raw format for native manipulation
          qemu-img convert -f vmdk -O raw "$VMDK_FILE" disk.raw

          export LIBGUESTFS_BACKEND=direct

          # Customize the disk and clean up the package caches
          virt-customize -a disk.raw \
            --network \
            --copy-in ../container/install.sh:/ \
            --copy-in ../container/salt-firstboot.sh:/ \
            --copy-in ../container/salt-firstboot.service:/ \
            --copy-in ../container/srv:/var/srv \
            --run-command "chmod +x /install.sh && /install.sh" \
            --run-command "chmod 644 -R /srv" \
            --run-command "echo 'Salty VCF Photon OS 5 Build' > /etc/motd" \
            --root-password password:changeme123! \
            --run-command "tdnf clean all" \
            --run-command "rm -f /install.sh /salt-firstboot.sh /salt-firstboot.service"

          # Sparsify to reclaim space
          virt-sparsify disk.raw disk_sparse.raw

          # Convert back to VMDK using the specific streamOptimized subformat
          rm "$VMDK_FILE"
          qemu-img convert -f raw -O vmdk -o subformat=streamOptimized disk_sparse.raw "$VMDK_FILE"

          rm disk.raw disk_sparse.raw

      - name: Repackage OVA with native ovftool conversion
        run: |
          cd build-dir
          OVF_FILE=$(ls *.ovf)
          rm -f *.mf

          # Use ovftool to repackage the OVA.
          ovftool --lax "$OVF_FILE" "custom-photon-${{ env.RELEASE_TAG }}.ova"

      - name: Verify OVA Contents
        run: |
          echo "======================================"
          echo "Final Uncompressed OVA File Size:"
          du -sh build-dir/custom-photon-${{ env.RELEASE_TAG }}.ova
          echo "======================================"

          echo "Listing contents of the generated OVA:"
          tar -tvf build-dir/custom-photon-${{ env.RELEASE_TAG }}.ova

      - name: Create Release and Upload OVA
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Zipping OVA for GitHub Release (Windows-friendly)..."
          # Compress the OVA into a standard .zip to bypass GitHub's 2GB file size limit
          cd build-dir
          zip -9 "custom-photon-${{ env.RELEASE_TAG }}.zip" "custom-photon-${{ env.RELEASE_TAG }}.ova"
          cd ..

          echo "======================================"
          echo "Final Zipped File Size:"
          du -sh "build-dir/custom-photon-${{ env.RELEASE_TAG }}.zip"
          echo "======================================"

          echo "Creating draft release for tag: ${{ env.RELEASE_TAG }}"

          # Upload the zipped artifact
          gh release create "${{ env.RELEASE_TAG }}" "build-dir/custom-photon-${{ env.RELEASE_TAG }}.zip" \
            --title "${{ env.RELEASE_TAG }}" \
            --draft \
            --generate-notes

      - name: Zip OVA for artifact upload
        if: github.ref_type != 'tag'
        run: |
          cd build-dir
          zip -9 "custom-photon-${{ env.RELEASE_TAG }}.zip" "custom-photon-${{ env.RELEASE_TAG }}.ova"

      - name: Upload OVA as CI artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: custom-photon-${{ env.RELEASE_TAG }}
          path: build-dir/custom-photon-${{ env.RELEASE_TAG }}.zip
          retention-days: 2

  build-container:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Generate tags based on git tags, or 'latest' for manual runs on main
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./container
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
