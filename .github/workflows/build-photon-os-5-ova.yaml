name: Build and Release Custom Photon OS 5 OVA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PHOTON_VERSION: "5.0"
  PHOTON_BUILD: "dde71ec57"
  PHOTON_SHA512: "6bd6a307745adb00b8452013f2c308c9abefd24a9d82611e8a1551afb965873388ebde81a34296dc0ad2fa7f0f7b4cd3924701abde0c963ea40b363c444bb037"

jobs:
  build-ova:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Virtualization Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils libguestfs-tools qemu-system-x86 unzip wget
          # Fix Ubuntu kernel permissions so supermin can build the guestfs appliance
          sudo chmod 644 /boot/vmlinuz-*

      - name: Cache VMware ovftool
        id: cache-ovftool
        uses: actions/cache@v4
        with:
          path: ovftool_dir
          key: ovftool-linux-${{ runner.os }}-v1

      - name: Download and Extract ovftool
        if: steps.cache-ovftool.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.OVF_REPO_TOKEN }}
        run: |
          gh release download v5.1.0 \
            --repo scriptautomate-bc/ovftool-artifacts-mirror \
            --pattern "*.zip" \
            --dir .
          
          unzip -q *.zip -d ovftool_dir/
          rm *.zip

      - name: Add ovftool to PATH
        run: |
          echo "${{ github.workspace }}/ovftool_dir/ovftool" >> $GITHUB_PATH
          chmod +x ${{ github.workspace }}/ovftool_dir/ovftool/ovftool

      - name: Cache Base Photon OVA
        id: cache-photon-ova
        uses: actions/cache@v4
        with:
          path: base-photon.ova
          # The cache key is bound to the version, build, and hash. 
          # If any env var changes, GHA will automatically start a fresh download.
          key: photon-ova-${{ env.PHOTON_VERSION }}-${{ env.PHOTON_BUILD }}-${{ env.PHOTON_SHA512 }}

      - name: Download Base Photon OS OVA
        if: steps.cache-photon-ova.outputs.cache-hit != 'true'
        run: |
          PHOTON_OVA_URL="https://packages.vmware.com/photon/${PHOTON_VERSION}/GA/ova/photon-hw15-${PHOTON_VERSION}-${PHOTON_BUILD}.x86_64.ova"
          wget -q "$PHOTON_OVA_URL" -O base-photon.ova

      - name: Validate OVA Checksum
        run: |
          # Verify the integrity of the OVA (runs on both downloaded and cached files)
          # Note: The two spaces between the hash and the filename are required by sha512sum
          echo "${PHOTON_SHA512}  base-photon.ova" | sha512sum -c -

      - name: Extract OVA & Customize Disk
        env:
          # Enable maximum debug logging for libguestfs as requested
          LIBGUESTFS_DEBUG: 1
          LIBGUESTFS_TRACE: 1
        run: |
          mkdir build-dir
          tar -xvf base-photon.ova -C build-dir
          cd build-dir

          VMDK_FILE=$(ls *.vmdk)

          qemu-img convert -f vmdk -O raw "$VMDK_FILE" disk.raw

          # --- UBUNTU 24.04 HOST FIXES ---
          # 1. Disable the unprivileged user namespace restriction. 
          # This allows 'passt' to create its network sandbox without crashing.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          # 2. Grant the GHA runner direct access to KVM hardware acceleration.
          sudo chmod 0666 /dev/kvm

          export LIBGUESTFS_BACKEND=direct

          # Run normally without sudo.
          # Added -v and -x flags for verbose debugging if 'passt' still fails.
          virt-customize -v -x -a disk.raw \
            --network \
            --run-command "tdnf update -y && tdnf install git jq -y" \
            --install "docker,git,tar" \
            --run-command "systemctl enable docker" \
            --run-command "echo 'Custom Photon OS 5 Build' > /etc/motd" \
            --root-password password:changeme123!

          rm "$VMDK_FILE"
          qemu-img convert -f raw -O vmdk disk.raw "$VMDK_FILE"
          rm disk.raw

      - name: Repackage OVA with ovftool
        run: |
          cd build-dir
          OVF_FILE=$(ls *.ovf)
          
          # Delete the old manifest so ovftool generates a fresh one
          rm -f *.mf
          
          # Repackage: --lax ignores the ovf:size byte mismatch of the customized disk
          ovftool --lax "$OVF_FILE" custom-photon5.ova

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: build-dir/custom-photon5.ova
          draft: true
