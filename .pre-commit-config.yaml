# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    # v6.0.0
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
  - repo: local
    hooks:
      - id: shellcheck-local
        name: Lint install.sh with ShellCheck
        entry: shellcheck
        language: system
        files: ^container/install\.sh$
        types: [shell]
  - repo: https://github.com/warpnet/salt-lint
    rev: 172f9121d82ff8452f7852877ccf34b33b50db8e
    hooks:
      - id: salt-lint
        # This regex ensures it only runs on .sls files inside your srv/ directory
        files: ^srv/.*\.sls$
